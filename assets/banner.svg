<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f8fafc;
    }
    .stat-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }

    /* Subtle pulsing / floating animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .orb-1 {
      animation: floatOrb1 10s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 150px 100px;
    }
    .orb-2 {
      animation: floatOrb2 12s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
      transform-origin: 1050px 320px;
    }
    .connecting-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 3s linear infinite;
    }
    .floating-card-1 {
      animation: badgeBounce 4s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: badgeBounce 4s ease-in-out infinite 2s;
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in the Background (strictly non-obstructive) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="160" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1060" cy="330" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle cx="950" cy="80" r="90" fill="#c084fc" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" rx="2" />

  <!-- Interactive Dynamic Pipeline Line (Connecting Tickets to SLA to Resolution) -->
  <g opacity="0.35">
    <path class="connecting-line" d="M 80 370 L 320 370 Q 360 370 380 340 T 440 310 L 760 310 Q 780 310 800 340 T 840 370 L 1120 370" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Center-Left: Foreground Clear Typography -->
  <g transform="translate(80, 55)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="19" class="tagline-text">Curated Open-Source &amp; SaaS</text>

    <!-- Main Title (Unobstructed Foreground) -->
    <text x="0" y="75" class="title-text">
      Awesome Customer Service
    </text>
    <text x="0" y="125" class="title-text" fill="url(#accentGrad)">
      &amp; Technical Support 🎧
    </text>

    <!-- Subtitle (Unobstructed Foreground) -->
    <text x="0" y="168" class="subtitle-text">
      The definitive directory for ticketing desks, ITSM platforms, SLAs &amp; AI support desks
    </text>

    <!-- Interactive Feature Badges / Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">⚡ Ticketing &amp; SLAs</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="158" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🤖 Autonomous AI</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(332, 0)">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🌐 Omnichannel Desks</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(512, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🔒 Self-Hosted ITSM</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Decorative Live Architecture Indicator Cards (Behind / Beside text to avoid obstruction) -->
  <g transform="translate(860, 55)">
    <!-- Card 1: Chatwoot / Open Source -->
    <g class="floating-card-1">
      <rect x="0" y="0" width="260" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
      <circle cx="28" cy="37" r="16" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <text x="28" y="42" text-anchor="middle" font-size="16">💬</text>
      <text x="54" y="32" class="stat-title">Chatwoot &amp; Zammad</text>
      <text x="54" y="52" class="stat-desc">Open-Source Omnichannel &amp; ITSM</text>
    </g>

    <!-- Card 2: Enterprise SaaS & JSM -->
    <g class="floating-card-2" transform="translate(0, 92)">
      <rect x="0" y="0" width="260" height="74" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#glow)" />
      <circle cx="28" cy="37" r="16" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />
      <text x="28" y="42" text-anchor="middle" font-size="16">🚀</text>
      <text x="54" y="32" class="stat-title">JSM &amp; Salesforce CSM</text>
      <text x="54" y="52" class="stat-desc">Enterprise Scaled Helpdesks</text>
    </g>

    <!-- Card 3: Free Tier & Pricing Breakdown -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="260" height="74" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="28" cy="37" r="16" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.5" />
      <text x="28" y="42" text-anchor="middle" font-size="16">📊</text>
      <text x="54" y="32" class="stat-title">Transparent Pricing</text>
      <text x="54" y="52" class="stat-desc">Zero-opaque TCO &amp; Free Limits</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <circle cx="80" cy="370" r="4" fill="#38bdf8" />
  <circle cx="1120" cy="370" r="4" fill="#c084fc" />
</svg>
